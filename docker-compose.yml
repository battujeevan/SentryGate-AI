services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./deploy/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8088:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: ./cmd/worker
    depends_on:
      - temporal
    environment:
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: sentrygate-saga
      SENTRYGATE_AUDIT_DB: /data/audit.db
      SENTRYGATE_WORKER_HEALTH_ADDR: ":8081"
      OTEL_EXPORTER: none
      OTEL_SERVICE_NAME: sentrygate
    volumes:
      - audit-data:/data
    ports:
      - "8081:8081"
    restart: unless-stopped

  proxy:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TARGET: ./cmd/sentrygate
    depends_on:
      - temporal
      - worker
    environment:
      SENTRYGATE_ADDR: ":8080"
      SENTRYGATE_API_KEY: ${SENTRYGATE_API_KEY:-dev-secret-change-me}
      TEMPORAL_HOST_PORT: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: sentrygate-saga
      SENTRYGATE_POLICY_PATH: /app/policies/default.yaml
      SENTRYGATE_AUDIT_DB: /data/audit.db
      OTEL_EXPORTER: none
      OTEL_SERVICE_NAME: sentrygate
    volumes:
      - audit-data:/data
      - ./policies:/app/policies:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  temporal-pg:
  audit-data:
