name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build binaries
        run: |
          go build -o /tmp/sentrygate ./cmd/sentrygate
          go build -o /tmp/worker ./cmd/worker
          go build -o /tmp/agent-sim ./cmd/agent-sim
